[project]
name = "charta"
version = "0.1.0"
description = "単ページ・ベクター作図ツール（研究図向けローカル PowerPoint）"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "qtawesome>=1.4",
]

[dependency-groups]
# ローカルの CI 相当チェック（§13）
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "pytest>=8.0",
]

# SAM3 選択的マスキング（§9.5、任意・GPU 前提）。`uv sync --group sam` で導入。
# 未導入でも本体は起動し、当該メニューが無効化されるだけ（app/ai/sam3.py の
# is_available() 判定・遅延 import）。
sam = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=5.0",
    "accelerate>=1.0",
]

# エージェント制御（§15）の MCP ブリッジ `tools/charta_mcp.py` 専用。
# 本体（app/）はこのグループに一切依存しない——ブリッジは別プロセスで動き、
# charta とは Unix ドメインソケットで話す。導入は `uv sync --group agent`。
# 上限を切るのは SDK 2.x で FastMCP -> MCPServer のリネームが進行中のため。
agent = [
    "mcp>=1.28,<2",
]

# パッケージ配布はしない（§1: dev 実行のみ）。プロジェクト自身はビルド/インストールせず、
# 依存だけを管理する仮想プロジェクトとして扱う。
[tool.uv]
package = false

# RTX 5080 (Blackwell sm_120) は CUDA 12.8 ビルドの torch が必須。sam グループの
# ときだけ PyTorch 公式 index から解決する（explicit=true で他パッケージは流れない）。
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", group = "sam" }]
torchvision = [{ index = "pytorch-cu128", group = "sam" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
